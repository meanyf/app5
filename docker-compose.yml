version: '3.9'

services:
  # ====================== API Gateway ======================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8000"
    volumes:
      - ./services/api-gateway/app:/app/app
      - ./services/shared:/app/app/shared
    env_file:
      - .env
    depends_on:
      - auth-service
      - activity-service
      - chat-service
      - media-service
    restart: unless-stopped

  # ====================== Auth Service ======================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8003:8000"
    volumes:
      - ./services/auth-service/app:/app/app
      - ./services/shared:/app/app/shared
    env_file:
      - .env
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================== Redis ======================
  redis:
    image: redis:7-alpine
    container_name: redis-app
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ====================== Activity Service ======================
  activity-service:
    build:
      context: ./services/activity-service
      dockerfile: Dockerfile
    container_name: activity-service
    ports:
      - "8000:8000"
    volumes:
      - ./services/activity-service/app:/app/app
      - ./services/shared:/app/app/shared
    env_file:
      - .env
    depends_on:
      postgres-activity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres-activity:
    image: postgis/postgis:16-3.5
    container_name: postgres-activity
    restart: unless-stopped
    environment:
      POSTGRES_DB: activity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - activity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================== Chat Service ======================
  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    ports:
      - "8001:8000"
    volumes:
      - ./services/chat-service/app:/app/app
      - ./services/shared:/app/app/shared
    env_file:
      - .env
    depends_on:
      postgres-chat:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres-chat:
    image: postgres:16
    container_name: postgres-chat
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================== Media Service ======================
  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    container_name: media-service
    ports:
      - "8002:8000"
    volumes:
      - ./services/media-service/app:/app/app
      - ./services/shared:/app/app/shared
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ====================== MinIO ======================
  minio:
    image: minio/minio:latest
    container_name: minio-app
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ====================== Kafka (KRaft) ======================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-app
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ====================== Kafka UI ======================
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: kafka-ui
  #   ports:
  #     - "8081:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8004:8000"
    volumes:
      - ./services/user-service/app:/app/app
    env_file:
      - .env
    depends_on:
      postgres-user:
        condition: service_healthy
    restart: unless-stopped

  postgres-user:
    image: postgres:16
    container_name: postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5435:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  auth_postgres_data:
  activity_postgres_data:
  chat_postgres_data:
  kafka_data:
  minio_data:
  redis_data:
  user_postgres_data:

  
version: "3.9"

networks:
  backend_net:
    driver: bridge

volumes:
  auth_db_data:
  users_db_data:
  activities_db_data:
  chat_db_data:
  redis_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:

services:

  # ────────────────────────────────────────────
  # NGINX
  # ────────────────────────────────────────────
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # API GATEWAY
  # ────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    env_file: .env
    depends_on:
      - redis
      - auth-service
      - user-service
      - activity-service
      - media-service
      - chat-service
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # AUTH SERVICE
  # ────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    env_file: .env
    depends_on:
      - auth-db
      - redis
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # USER SERVICE
  # ────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    env_file: .env
    depends_on:
      - users-db
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # ACTIVITY SERVICE
  # ────────────────────────────────────────────
  activity-service:
    build: ./services/activity-service
    env_file: .env
    depends_on:
      - activities-db
      - kafka
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # MEDIA SERVICE
  # ────────────────────────────────────────────
  media-service:
    build: ./services/media-service
    env_file: .env
    depends_on:
      - minio
      - kafka
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # VIDEO WORKER
  # ────────────────────────────────────────────
  video-worker:
    build: ./services/video-worker
    env_file: .env
    depends_on:
      - kafka
      - minio
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # MODERATION SERVICE
  # ────────────────────────────────────────────
  moderation-service:
    build: ./services/moderation-service
    env_file: .env
    depends_on:
      - kafka
      - activities-db
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # CHAT SERVICE
  # ────────────────────────────────────────────
  chat-service:
    build: ./services/chat-service
    env_file: .env
    depends_on:
      - chat-db
      - kafka
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # NOTIFICATION SERVICE
  # ────────────────────────────────────────────
  notification-service:
    build: ./services/notification-service
    env_file: .env
    depends_on:
      - kafka
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # DATABASES
  # ────────────────────────────────────────────
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_pass
    volumes:
      - users_db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped

  activities-db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: activities_db
      POSTGRES_USER: activities_user
      POSTGRES_PASSWORD: activities_pass
    volumes:
      - activities_db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped

  chat-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # PGBOUNCER
  # ────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: "host=auth-db dbname=auth_db user=auth_user password=auth_pass"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    depends_on:
      - auth-db
      - users-db
      - activities-db
      - chat-db
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # REDIS
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # MINIO
  # ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # KAFKA (KRaft mode)
  # ────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # KAFKA UI
  # ────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # PROMETHEUS
  # ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend_net
    restart: unless-stopped

  # ────────────────────────────────────────────
  # GRAFANA
  # ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend_net
    restart: unless-stopped

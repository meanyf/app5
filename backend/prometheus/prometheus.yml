global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: user-service
    static_configs:
      - targets: ["user-service:8000"]

  - job_name: activity-service
    static_configs:
      - targets: ["activity-service:8000"]

  - job_name: media-service
    static_configs:
      - targets: ["media-service:8000"]

  - job_name: moderation-service
    static_configs:
      - targets: ["moderation-service:8000"]

  - job_name: chat-service
    static_configs:
      - targets: ["chat-service:8000"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8000"]
